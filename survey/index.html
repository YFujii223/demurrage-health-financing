<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script>
  /* ============================================================
     アンケート（Google フォーム）の URL。https:// で始まる URL を入れると、
     このページを開いた人はそのフォームへ自動で移動します。
     空（""）にすると「準備中」の案内を表示します。
     ※ JavaScript が無効な端末向けに、下の <noscript> の2か所（meta refresh と
       「アンケートへ進む」のリンク）にも同じ URL を書いています。URL を変えるときは
       この FORM_URL と合わせて、その2か所も同じ URL に書き換えてください。
     ============================================================ */
  var FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSdJdr3Mh05qXq9WxqhEsgyiucmCa9WsA8db4TsL24oahIubig/viewform";

  (function () {
    if (typeof FORM_URL === 'string' && /^https:\/\//.test(FORM_URL)) {
      window.__SURVEY_REDIRECT__ = true;
      // meta refresh（JS による移動が止められた場合の予備）
      var m = document.createElement('meta');
      m.httpEquiv = 'refresh';
      m.content = '0;url=' + FORM_URL;
      document.head.appendChild(m);
      // JS による移動（戻るボタンでこのページに戻らないよう replace を使う）
      try { window.location.replace(FORM_URL); } catch (e) { /* meta refresh に任せる */ }
    }
  })();
</script>
<noscript><meta http-equiv="refresh" content="0;url=https://docs.google.com/forms/d/e/1FAIpQLSdJdr3Mh05qXq9WxqhEsgyiucmCa9WsA8db4TsL24oahIubig/viewform"></noscript>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アンケート（第64回日本医療・病院管理学会 ポスター発表）</title>
<meta name="description" content="第64回日本医療・病院管理学会 ポスター発表のアンケートページ。">
<style>
  /* 配色は補足資料ページ（../index.html）の色変数に合わせる。緑・橙は使わない */
  :root{
    --darkNavy:#0F1E3D; --navy:#1B3A5C; --blue:#2563EB; --lightBlue:#DBEAFE;
    --paleBlue:#EFF6FF; --cream:#F8FAFC; --text:#1E293B; --muted:#64748B; --border:#CBD5E1;
    --midBlue:#BFDBFE; --white:#FFFFFF;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%; color-scheme:light}
  body{
    margin:0; background:var(--cream); color:var(--text);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
    font-size:17px; line-height:1.75; -webkit-font-smoothing:antialiased;
    line-break:strict; overflow-wrap:anywhere; word-break:auto-phrase;
  }
  [hidden]{display:none !important}
  a{color:var(--blue)}
  .top{background:linear-gradient(135deg,var(--darkNavy),var(--navy)); color:#fff; border-bottom:4px solid var(--blue)}
  .top .inner{max-width:560px; margin:0 auto; padding:14px 16px 12px}
  .badge{
    display:inline-block; font-size:14px; line-height:1.5; color:var(--lightBlue);
    border:1px solid rgba(219,234,254,.5); border-radius:999px; padding:2px 10px; margin:0 0 6px;
  }
  .top-title{font-size:18px; font-weight:700; margin:0}
  .wrap{max-width:560px; margin:0 auto; padding:24px 16px 48px}
  h1{font-size:24px; line-height:1.45; margin:0 0 14px; color:var(--darkNavy)}
  p{margin:0 0 14px}
  .notice{background:var(--paleBlue); border:1px solid var(--midBlue); border-radius:12px; padding:16px; color:var(--navy)}
  .notice p:last-child{margin-bottom:0}
  .contact{margin-top:16px}
  .poster{margin-top:24px; padding-top:18px; border-top:2px solid var(--border)}
  .poster .label{font-size:16px; font-weight:600; color:var(--muted); margin:0 0 4px}
  .poster .title{font-weight:700; color:var(--darkNavy); margin:0 0 6px}
  .poster .meta{color:var(--muted); margin:0}
  .btn{
    display:flex; align-items:center; justify-content:center; width:100%; min-height:56px; margin-top:14px;
    padding:12px 16px; border-radius:12px; background:var(--blue); color:#fff;
    font-size:18px; font-weight:700; text-decoration:none;
  }
  .btn:focus-visible{outline:3px solid var(--darkNavy); outline-offset:2px}
</style>
</head>
<body>
<header class="top">
  <div class="inner">
    <p class="badge">第64回日本医療・病院管理学会　ポスター発表</p>
    <p class="top-title">アンケート</p>
  </div>
</header>

<main class="wrap">
  <!-- FORM_URL が入っているとき（JS が無効な端末でも、この表示とリンクが出る） -->
  <section id="redirecting">
    <h1>アンケートのページへ移動しています</h1>
    <div class="notice">
      <p>自動で移動しない場合は、下のボタンから開いてください。</p>
    </div>
    <a class="btn" id="form-link" href="https://docs.google.com/forms/d/e/1FAIpQLSdJdr3Mh05qXq9WxqhEsgyiucmCa9WsA8db4TsL24oahIubig/viewform">アンケートへ進む</a>
    <p class="contact">ご意見・お問い合わせ：<a href="mailto:ainsoph567@gmail.com">ainsoph567@gmail.com</a></p>
  </section>

  <!-- FORM_URL が空のとき（準備中の表示） -->
  <section id="preparing" hidden>
    <h1>アンケート</h1>
    <div class="notice">
      <p>アンケートは準備中です。ご意見は <a href="mailto:ainsoph567@gmail.com">ainsoph567@gmail.com</a> へお寄せください。</p>
    </div>
  </section>

  <section class="poster" aria-label="演題">
    <p class="label">演題</p>
    <p class="title">有効期限付きポイントによる医療・介護財源の設計と診療報酬・介護報酬改定原資創出のシミュレーション分析</p>
    <p class="meta">藤井 佑機（第64回日本医療・病院管理学会　ポスター発表）</p>
  </section>
</main>

<script>
(function () {
  'use strict';
  if (window.__SURVEY_REDIRECT__) {
    document.getElementById('form-link').href = FORM_URL;
  } else {
    document.getElementById('redirecting').hidden = true;
    document.getElementById('preparing').hidden = false;
  }
})();
</script>
</body>
</html>
